[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-kernels"
version = "0.3.0"
description = "GPU and Ascend NPU kernels with numerical references and reproducible benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND LicenseRef-CANN-Open-Software-2.0"
license-files = ["LICENSE", "kernels/include/xpu_kernels/mhc_post_backward/LICENSE", "third-party/deep-jit/LICENSE", "src/xpu_kernels/backends/_tilekernels/LICENSE"]
dependencies = ["torch", "ninja>=1.11"]

[project.optional-dependencies]
gpu = ["triton"]
mhc-gpu = ["torch>=2.13", "tilelang>=0.1.15,<0.2"]
npu = []
dev = ["pytest"]

[project.scripts]
xpu-kernels = "xpu_kernels.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
xpu_kernels = ["_native/**/*", "backends/_tilekernels/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
